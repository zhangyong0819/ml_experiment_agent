[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-experiment-agent"
version = "1.0.0"
description = "Stateful ML experiments with diagnosis and controlled recovery"
requires-python = ">=3.11,<3.12"
dependencies = ["pydantic>=2.7,<3", "SQLAlchemy>=2,<3", "PyYAML>=6,<7", "torch>=2.2,<3", "scikit-learn>=1.4,<2", "langgraph==1.2.12", "langgraph-checkpoint-sqlite==3.1.1", "langchain-core==1.6.5", "langchain-deepseek==1.1.1", "langchain-huggingface==1.2.2", "sentence-transformers==6.1.0", "faiss-cpu==1.15.1", "fastapi==0.141.1", "uvicorn==0.54.0"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.28,<1", "httpx2>=2,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
